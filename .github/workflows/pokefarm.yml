# Gera o PokeFarm para Mac (.dmg) e Windows (.exe) em máquinas reais de cada sistema.
# Uso: suba esta pasta para um repositório no GitHub e rode em Actions > PokeFarm build > Run workflow.
name: PokeFarm build

on:
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: macos-latest
            script: dist:mac
          - os: windows-latest
            script: dist:win
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: PokeFarm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run ${{ matrix.script }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - uses: actions/upload-artifact@v4
        with:
          name: PokeFarm-${{ runner.os }}
          path: |
            PokeFarm/dist/*.dmg
            PokeFarm/dist/*.exe
